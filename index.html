      /* Boot screen: pure CSS, so it shows before any script runs. The app removes it once it has mounted. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:

        color: #fff;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        transition: opacity 360ms ease, visibility 360ms ease;
      }
      #boot.boot-hide {
        opacity: 0;
        visibility: hidden;
      }
      #boot .boot-logo {
        animation: boot-float 2.4s ease-in-out infinite;
        filter: drop-shadow(0 14px 30px rgba(99, 102, 241, 0.55));
      }
      #boot .boot-word {

        font-weight: 700;
        letter-spacing: -0.03em;
      }
      #boot .boot-word span {
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot .boot-tag {
        margin-top: -8px;
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: #94a3b8;
      }
      #boot .boot-bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
      }
      #boot .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #3b82f6, #7c3aed);
        animation: boot-bar 1.2s ease-in-out infinite;
      }
      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes boot-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-logo,
        #boot .boot-bar::after {
          animation: none;
        }
      }
