      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      html,
      body {
        background: #080d1b;
      }
      /* Boot screen: pure CSS, so it shows before any script runs. The app removes it once it has mounted. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(520px 320px at 20% 0%, rgba(59, 130, 246, 0.25), transparent 70%),
          radial-gradient(480px 320px at 90% 100%, rgba(124, 58, 237, 0.22), transparent 70%), #080d1b;
        color: #fff;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        transition: opacity 360ms ease, visibility 360ms ease;
      }
      #boot.boot-hide {
        opacity: 0;
        visibility: hidden;
      }
      #boot .boot-logo {
        animation: boot-float 2.4s ease-in-out infinite;
        filter: drop-shadow(0 14px 30px rgba(99, 102, 241, 0.55));
      }
      #boot .boot-word {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      #boot .boot-word span {
        background: linear-gradient(135deg, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot .boot-tag {
        margin-top: -8px;
        font-family: 'DM Sans', system-ui, sans-serif;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: #94a3b8;
      }
      #boot .boot-bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
      }
      #boot .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #3b82f6, #7c3aed);
        animation: boot-bar 1.2s ease-in-out infinite;
      }
      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes boot-bar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-logo,
        #boot .boot-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Built with Arc Studio — https://studio.arc.io -->
    <div id="boot" role="status" aria-label="Loading TopPay">
      <svg class="boot-logo" width="76" height="76" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="boot-tile" x1="2" y1="1" x2="26" y2="27" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3b82f6" />
            <stop offset="1" stop-color="#7c3aed" />
          </linearGradient>
        </defs>
        <rect width="28" height="28" rx="9" fill="url(#boot-tile)" />
        <rect x="0.5" y="0.5" width="27" height="27" rx="8.5" stroke="rgba(255,255,255,0.28)" />
        <path d="M7.5 9.5h13" stroke="#dbeafe" stroke-width="2.6" stroke-linecap="round" />
        <path d="M14 9.5v9" stroke="#fff" stroke-width="2.6" stroke-linecap="round" />
        <circle cx="14" cy="21" r="1.5" fill="#fde68a" />
      </svg>
      <div class="boot-word">Top<span>Pay</span></div>
      <div class="boot-tag">Send. Receive. Move Money.</div>
      <div class="boot-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
